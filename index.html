<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuthering Love</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #08090d; /* Тёмный фон игры */
            color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1a1c24 0%, #000000 100%);
        }

        /* Анимация появления */
        .container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s forwards;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Декоративные линии как в UI игры */
        .tech-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            margin: 20px 0;
            width: 100%;
        }

        .header-icon {
            width: 60px;
            height: 60px;
            border: 2px solid #d4c38d; /* Золотой цвет */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 15px rgba(212, 195, 141, 0.4);
        }

        .header-icon span {
            font-size: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #8faec5; /* Техно-голубой */
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* Карточка с посланием */
        .message-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 4px;
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* Золотая рамка (как 5 звезд) */
        .message-card.legendary {
            border: 1px solid #d4c38d;
            box-shadow: 0 0 20px rgba(212, 195, 141, 0.2);
        }

        .main-text {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #d4c38d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            line-height: 1.5;
            color: #ccc;
        }

        /* Статы */
        .stats {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        .stat-box {
            text-align: center;
        }
        
        .stat-value {
            display: block;
            font-size: 18px;
            color: #d4c38d;
            font-weight: bold;
        }

        /* Кнопка */
        .btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #fff;
            color: white;
            padding: 10px 30px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #d4c38d;
            color: #d4c38d;
        }

        /* Глитч эффект на фоне (опционально) */
        .bg-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <div class="container">
        <!-- Иконка сверху -->
        <div class="header-icon">
            <span>✦</span>
        </div>

        <h1>Резонанс Обнаружен</h1>
        <div class="subtitle">СИНХРОНИЗАЦИЯ: 100%</div>

        <div class="tech-line"></div>

        <!-- Карточка -->
        <div class="message-card legendary">
            <div class="main-text">Я ТЕБЯ ЛЮБЛЮ</div>
            <div class="description">
                Ты — мой самый редкий дроп в этой вселенной.<br>
                Никакие Эхо не звучат так громко, как мое сердце рядом с тобой.
            </div>

            <!-- Имитация статов -->
            <div class="stats">
                <div class="stat-box">
                    <span class="stat-value">LVL ∞</span>
                    <span>Уровень чувств</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">MAX</span>
                    <span>Единство</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">5 ★</span>
                    <span>Редкость</span>
                </div>
            </div>
        </div>

        <!-- Кнопка действия -->
        <button class="btn" onclick="alert('Обнять крепко-крепко!')">Принять</button>
    </div>

</body>
</html>
